[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelkid"
version = "0.3.0"
description = "Превращает фото в пиксель-арт и PDF-раскраску по номерам. Сделано для мастер-классов по Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "Pillow>=9.1",
    "numpy>=1.21",
    # reportlab 5 работает только на Python 3.10+, но не пишет это в метаданных
    "reportlab>=4.0,<5; python_version < '3.10'",
    "reportlab>=4.0; python_version >= '3.10'",
]
keywords = ["pixel art", "image", "pillow", "coloring", "pdf", "education", "kids"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Intended Audience :: Education",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixelkid = ["fonts/*"]
